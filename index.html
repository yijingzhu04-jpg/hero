  { relX: 0.91, relY: 0.78, baseW: 200, aspect: 1.05, phase: 4.5 }  // Bottom right edge card
];

let cards = [];
let hoveredCard = null;
let activeFlippedCard = null;

let mousePos = { x: -1000, y: -1000 };
let timeSec = 0;

// Infinite Canvas Camera State & Inertial Physics
let camX = 0;
let camY = 0;
let velX = 0;
let velY = 0;

// Pointer Drag Tracking
let isPointerDown = false;
let isDragging = false;
let dragDist = 0;
let lastPointerPos = { x: 0, y: 0 };

// Prevent touch default scrolling behavior on canvas element
canvas.style.touchAction = "none";

// Portable pointer resolution helper (works in Brik runtime & standalone iframe / site)
function getPointerPos(e) {
  if (window.CanvasRuntimeAPI && typeof window.CanvasRuntimeAPI.getMousePos === "function") {
    try {
      return window.CanvasRuntimeAPI.getMousePos(e);
    } catch (err) {}
  }
  const rect = canvas.getBoundingClientRect();
  const touch = (e.touches && e.touches.length > 0)
    ? e.touches[0]
    : ((e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : e);
  const clientX = touch ? touch.clientX : (e.clientX || 0);
  const clientY = touch ? touch.clientY : (e.clientY || 0);
  return {
    x: (clientX - rect.left) * (canvas.width / (rect.width || 1)),
    y: (clientY - rect.top) * (canvas.height / (rect.height || 1))
  };
}

// Helper: Linear interpolation
function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Persistent Canvas State Wiring (Brik controls integration with standalone fallback)
function getControlVal(key, fallback) {
  if (window.controls && typeof window.controls.get === "function") {
    const val = window.controls.get(key);
    return val !== undefined ? val : fallback;
  }
  return fallback;
}

function applyCanvasState(state) {
  if (state && typeof state === "object") {
    camX = state.camX || 0;
    camY = state.camY || 0;
  }
}

if (window.controls && typeof window.controls.get === "function") {
  applyCanvasState(window.controls.get("canvasState"));
  window.controls.onChange("canvasState", (st) => applyCanvasState(st));
}

function saveCanvasState() {
  if (window.controls && typeof window.controls.set === "function") {
    window.controls.set("canvasState", { camX, camY });
  }
}

// Preload images into map
function preloadImages(urls) {
  urls.forEach((url) => {
    if (!imageCache.has(url)) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      img.onload = () => imageCache.set(url, img);
      imageCache.set(url, img);
    }
  });
}

// Rebuild card objects when schema or images change
function initCards() {
  const imageUrls = getControlVal("projectImages", DEFAULT_IMAGES);
  preloadImages(imageUrls);

  const entranceStagger = getControlVal("entranceStagger", 0.1);

  cards = imageUrls.map((url, i) => {
    const layout = LAYOUT_PRESETS[i % LAYOUT_PRESETS.length];
    const meta = PROJECT_METADATA[i % PROJECT_METADATA.length];

    const card = {
      id: i,
      url: url,
      title: meta.title,
      category: meta.category,
      tag: meta.tag,
      date: meta.date || "2026",
      relX: layout.relX,
      relY: layout.relY,
      baseW: layout.baseW,
      aspect: layout.aspect,
      floatPhase: layout.phase,
      entranceProgress: 0,
      hoverProgress: 0,
      flipProgress: 0, // 0 = front thumbnail, 1 = overturned back description
      floatOffset: 0,
      isHovered: false,
      isFlipped: false,
      projX: 0,
      projY: 0,
      width: 0,
      height: 0
    };

    // Staggered entrance animation using GSAP
    if (gsapLib) {
      gsapLib.to(card, {
        entranceProgress: 1,
        duration: 0.9,
        delay: i * entranceStagger,
        ease: "back.out(1.4)"
      });
    } else {
      card.entranceProgress = 1;
    }

    return card;
  });
}

// Draw rectangle helper (crisp square corners - 0px border radius)
function drawSquareRect(ctx, x, y, width, height) {
  ctx.beginPath();
  ctx.rect(x, y, width, height);
  ctx.closePath();
}

// Wrap text helper for card back description
function getWrappedLines(ctx, text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let currentLine = words[0] || "";

  for (let i = 1; i < words.length; i++) {
    const word = words[i];
    const width = ctx.measureText(currentLine + " " + word).width;
    if (width < maxWidth) {
      currentLine += " " + word;
    } else {
      lines.push(currentLine);
      currentLine = word;
    }
  }
  if (currentLine) lines.push(currentLine);
  return lines;
}

// Draw Single Card Helper
function drawSingleCard(card, w, h, centerX, centerY, hoverScaleSetting, fontFamily, textColor) {
  if (card.entranceProgress <= 0.01) return;

  ctx.save();

  const fp = card.flipProgress;
  const hoverScale = 1 + card.hoverProgress * (hoverScaleSetting - 1);
  const entranceScale = card.entranceProgress;

  // Target focal dimensions when overturned
  const targetW = Math.min(620, w * 0.85);
  const targetH = Math.min(420, h * 0.7);

  // Interpolate center position & size during overturn flip
  const curX = lerp(card.projX, centerX, fp);
  const curY = lerp(card.projY, centerY, fp);

  const baseRenderW = card.width * hoverScale * entranceScale;
  const baseRenderH = card.height * hoverScale * entranceScale;

  const curW = lerp(baseRenderW, targetW, fp);
  const curH = lerp(baseRenderH, targetH, fp);

  // 3D Overturn Flip Angle Y (0 to Math.PI radians)
  const angleY = fp * Math.PI;
  const cosA = Math.cos(angleY);
  const absCos = Math.abs(cosA);

  // Subtle 3D perspective elevation scaling on mid-turn
  const sinA = Math.sin(angleY);
  const perspectiveScaleY = 1 + sinA * 0.04;

  ctx.translate(curX, curY);

  // Apply 2D Scale flip transform with 3D depth perspective
  ctx.scale(cosA, perspectiveScaleY);

  const halfW = curW / 2;
  const halfH = curH / 2;

  if (cosA >= 0) {
    // --- FRONT SIDE (IMAGE THUMBNAIL - SQUARE CORNERS) ---
    const shadowBlur = (12 + card.hoverProgress * 18 + fp * 20) * absCos;
    const shadowAlpha = (0.08 + card.hoverProgress * 0.15 + fp * 0.15) * absCos;

    ctx.shadowColor = `rgba(0, 0, 0, ${shadowAlpha})`;
    ctx.shadowOffsetY = (4 + card.hoverProgress * 8) * absCos;
    ctx.shadowBlur = shadowBlur;

    ctx.fillStyle = "#FFFFFF";
    drawSquareRect(ctx, -halfW, -halfH, curW, curH);
    ctx.fill();

    ctx.shadowColor = "transparent";

    ctx.save();
    drawSquareRect(ctx, -halfW, -halfH, curW, curH);
    ctx.clip();

    const cachedImg = imageCache.get(card.url);
    if (cachedImg && cachedImg.complete && cachedImg.naturalWidth > 0) {
      ctx.drawImage(cachedImg, -halfW, -halfH, curW, curH);
    } else {
      ctx.fillStyle = "#EAEAEA";
      ctx.fillRect(-halfW, -halfH, curW, curH);
    }
    ctx.restore();

    ctx.strokeStyle = `rgba(0, 0, 0, ${0.06 + card.hoverProgress * 0.12})`;
    ctx.lineWidth = 1;
    drawSquareRect(ctx, -halfW, -halfH, curW, curH);
    ctx.stroke();
  } else {
    // --- BACK SIDE (OVERTURNED DESCRIPTION - SQUARE CORNERS) ---
    ctx.save();
    ctx.scale(-1, 1); // Un-mirror horizontal scale so text reads left-to-right

    // Card Back Surface
    ctx.shadowColor = `rgba(0, 0, 0, ${0.25 * absCos})`;
    ctx.shadowOffsetY = 12 * absCos;
    ctx.shadowBlur = 28 * absCos;

    ctx.fillStyle = "#FFFFFF";
    drawSquareRect(ctx, -halfW, -halfH, curW, curH);
    ctx.fill();

    ctx.shadowColor = "transparent";

    // Subtle Outer Border
    ctx.strokeStyle = "rgba(0, 0, 0, 0.08)";
    ctx.lineWidth = 1.5;
    drawSquareRect(ctx, -halfW, -halfH, curW, curH);
    ctx.stroke();

    // Card Content Padding
    const padX = curW * 0.07;
    const padY = curH * 0.08;
    const contentW = curW - padX * 2;

    // Category Tag Header
    const catFontSize = Math.max(11, Math.round(curW * 0.026));
    ctx.font = `600 ${catFontSize}px ${fontFamily}, sans-serif`;
    ctx.fillStyle = "#666666";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    const catHeader = card.date ? `${card.category.toUpperCase()} • ${card.date}` : card.category.toUpperCase();
    ctx.fillText(catHeader, -halfW + padX, -halfH + padY);

    // Top-Right Close Button
    const closeFontSize = Math.max(13, Math.round(curW * 0.03));
    ctx.font = `500 ${closeFontSize}px ${fontFamily}, sans-serif`;
    ctx.fillStyle = "#888888";
    ctx.textAlign = "right";
    ctx.fillText("✕", halfW - padX, -halfH + padY);

    // Main Project Title
    const titleFontSize = Math.max(16, Math.round(curW * 0.046));
    ctx.font = `700 ${titleFontSize}px ${fontFamily}, sans-serif`;
    ctx.fillStyle = textColor;
    ctx.textAlign = "left";
    ctx.fillText(card.title, -halfW + padX, -halfH + padY + catFontSize + 10);

    // Tag Pill Badge
    const tagY = -halfH + padY + catFontSize + titleFontSize + 20;
    const tagFontSize = Math.max(10, Math.round(curW * 0.024));
    ctx.font = `500 ${tagFontSize}px ${fontFamily}, sans-serif`;

    const tagTextWidth = ctx.measureText(card.tag).width;
    const pillPadX = 12;
    const pillHeight = tagFontSize + 8;

    ctx.fillStyle = "#F0F0F4";
    drawSquareRect(ctx, -halfW + padX, tagY, tagTextWidth + pillPadX * 2, pillHeight);
    ctx.fill();

    ctx.fillStyle = "#333333";
    ctx.fillText(card.tag, -halfW + padX + pillPadX, tagY + 4);

    // Divider Line
    const divY = tagY + pillHeight + 14;
    ctx.strokeStyle = "#EEEEEE";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-halfW + padX, divY);
    ctx.lineTo(halfW - padX, divY);
    ctx.stroke();

    // Modal Description Paragraph
    const descY = divY + 14;
    const descFontSize = Math.max(12, Math.round(curW * 0.03));
    ctx.font = `400 ${descFontSize}px ${fontFamily}, sans-serif`;
    ctx.fillStyle = "#444444";

    const defaultDesc = "A modern UX research & design project exploring human-computer interaction, spatial arrangement, and expressive visual aesthetics.";
    const descText = getControlVal("modalDescription", defaultDesc);
    const lines = getWrappedLines(ctx, descText, contentW);
    const lineHeight = descFontSize * 1.45;

    lines.forEach((line, idx) => {
      if (descY + idx * lineHeight < halfH - padY - 24) {
        ctx.fillText(line, -halfW + padX, descY + idx * lineHeight);
      }
    });

    // Bottom "Flip Back" Action Hint
    const hintFontSize = Math.max(10, Math.round(curW * 0.024));
    ctx.font = `500 ${hintFontSize}px ${fontFamily}, sans-serif`;
    ctx.fillStyle = "#888888";
    ctx.textAlign = "center";
    ctx.fillText("↻ Click anywhere to overturn back", 0, halfH - padY - 2);

    ctx.restore();
  }

  ctx.restore();
}

// Main Render Loop
function render() {
  const w = canvas.width;
  const h = canvas.height;

  timeSec += 0.016;

  const inertiaSetting = getControlVal("canvasInertia", 0.92);

  // Inertia momentum integration when not dragging
  if (!isPointerDown) {
    camX += velX;
    camY += velY;

    velX *= inertiaSetting;
    velY *= inertiaSetting;

    if (Math.abs(velX) < 0.005) velX = 0;
    if (Math.abs(velY) < 0.005) velY = 0;
  }

  const textColor = getControlVal("textColor", "#111111");
  const floatAmplitude = getControlVal("floatAmplitude", 10);
  const floatDuration = getControlVal("floatDuration", 3.2);
  const hoverScaleSetting = getControlVal("hoverScale", 1.04);
  const cardScaleSetting = getControlVal("cardScale", 1.0);
  const fontObj = getControlVal("mainFont", { family: "Inter", weight: "500" });
  const fontFamily = fontObj.family || "sans-serif";

  // Transparent background clear
  ctx.clearRect(0, 0, w, h);

  const centerX = w / 2;
  const centerY = h / 2;

  const speed = (2 * Math.PI) / Math.max(0.5, floatDuration);
  const scaleFactor = Math.min(w / 1920, h / 1080) * cardScaleSetting;

  // Compute 2D Seamless Wrapping Grid Size
  const maxCardDim = 320 * scaleFactor;
  const gridW = Math.max(w + maxCardDim * 1.3, 1300);
  const gridH = Math.max(h + maxCardDim * 1.3, 950);

  // Position each card in infinite wrapped 2D space
  cards.forEach((card) => {
    card.width = card.baseW * scaleFactor;
    card.height = (card.baseW / card.aspect) * scaleFactor;

    // Base position in canonical grid pattern relative to center
    const baseAbsX = (card.relX - 0.5) * gridW;
    const baseAbsY = (card.relY - 0.5) * gridH;

    // Ambient floating sine wave
    if (!card.isHovered && card.flipProgress < 0.01) {
      card.floatOffset = Math.sin(timeSec * speed + card.floatPhase) * floatAmplitude;
    } else {
      card.floatOffset = lerp(card.floatOffset, 0, 0.1);
    }

    // Cumulative 2D position with camera offset
    const rawX = baseAbsX + camX;
    const rawY = baseAbsY + camY + card.floatOffset;

    // Infinite 2D Modulo Wrapping Math around canvas center
    let wrappedDx = (((rawX + gridW / 2) % gridW) + gridW) % gridW - gridW / 2;
    let wrappedDy = (((rawY + gridH / 2) % gridH) + gridH) % gridH - gridH / 2;

    card.projX = centerX + wrappedDx;
    card.projY = centerY + wrappedDy;
  });

  // Hit testing & hover state (Axis-Aligned Box)
  let currentHovered = null;
  if (!activeFlippedCard) {
    for (let i = cards.length - 1; i >= 0; i--) {
      const card = cards[i];
      if (card.entranceProgress < 0.1) continue;

      const hoverScale = 1 + card.hoverProgress * (hoverScaleSetting - 1);
      const scaledW = card.width * hoverScale;
      const scaledH = card.height * hoverScale;

      if (
        mousePos.x >= card.projX - scaledW / 2 &&
        mousePos.x <= card.projX + scaledW / 2 &&
        mousePos.y >= card.projY - scaledH / 2 &&
        mousePos.y <= card.projY + scaledH / 2
      ) {
        currentHovered = card;
        break;
      }
    }
  }

  // Handle Hover Transitions
  cards.forEach((card) => {
    const isNowHovered = currentHovered === card;

    if (isNowHovered && !card.isHovered) {
      card.isHovered = true;
      if (gsapLib) {
        gsapLib.to(card, { hoverProgress: 1, duration: 0.25, ease: "power2.out" });
      } else {
        card.hoverProgress = 1;
      }
    } else if (!isNowHovered && card.isHovered) {
      card.isHovered = false;
      if (gsapLib) {
        gsapLib.to(card, { hoverProgress: 0, duration: 0.35, ease: "power2.out" });
      } else {
        card.hoverProgress = 0;
      }
    }
  });

  hoveredCard = currentHovered;

  const flipProgress = activeFlippedCard ? activeFlippedCard.flipProgress : 0;

  // STEP 1: Render background cards
  cards.forEach((card) => {
    if (card === activeFlippedCard) return;

    ctx.save();
    drawSingleCard(card, w, h, centerX, centerY, hoverScaleSetting, fontFamily, textColor);
    ctx.restore();
  });

  // STEP 2: Render semi-transparent gray overlay over whole page when card is flipped
  if (flipProgress > 0.001) {
    ctx.save();
    ctx.fillStyle = `rgba(35, 35, 40, ${flipProgress * 0.55})`;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  // STEP 3: Render Active Flipped Card ON TOP of the gray overlay
  if (activeFlippedCard) {
    ctx.save();
    drawSingleCard(activeFlippedCard, w, h, centerX, centerY, hoverScaleSetting, fontFamily, textColor);
    ctx.restore();
  }

  // Cursor state
  if (isDragging) {
    canvas.style.cursor = "grabbing";
  } else if (hoveredCard || activeFlippedCard) {
    canvas.style.cursor = "pointer";
  } else {
    canvas.style.cursor = "grab";
  }
}

// Open Overturn Flip Animation
function flipCardOpen(card) {
  if (activeFlippedCard) return;

  activeFlippedCard = card;
  card.isFlipped = true;
  const duration = getControlVal("flipDuration", 0.65);

  if (gsapLib) {
    gsapLib.to(card, {
      flipProgress: 1,
      duration: duration,
      ease: "power3.inOut"
    });
  } else {
    card.flipProgress = 1;
  }
}

// Close Overturn Flip Back Animation
function flipCardBack(card) {
  if (!card) return;

  const duration = getControlVal("flipDuration", 0.55);

  if (gsapLib) {
    gsapLib.to(card, {
      flipProgress: 0,
      duration: duration,
      ease: "power3.inOut",
      onComplete: () => {
        card.isFlipped = false;
        if (activeFlippedCard === card) {
          activeFlippedCard = null;
        }
      }
    });
  } else {
    card.flipProgress = 0;
    card.isFlipped = false;
    activeFlippedCard = null;
  }
}

// Mouse Wheel 2D Scroll Impulse
function onWheel(e) {
  e.preventDefault();

  const sensitivity = getControlVal("dragSensitivity", 1.2);
  const deltaX = e.deltaX || 0;
  const deltaY = e.deltaY || 0;

  velX -= deltaX * 0.18 * sensitivity;
  velY -= deltaY * 0.18 * sensitivity;
}

// Pointer & Touch Drag Handlers
function onPointerDown(e) {
  isPointerDown = true;
  isDragging = false;
  dragDist = 0;

  const pos = getPointerPos(e);
  lastPointerPos = { x: pos.x, y: pos.y };
  mousePos = pos;
}

function onPointerMove(e) {
  const pos = getPointerPos(e);
  mousePos = pos;

  if (isPointerDown) {
    const dx = pos.x - lastPointerPos.x;
    const dy = pos.y - lastPointerPos.y;
    const dist = Math.hypot(dx, dy);
    dragDist += dist;

    if (dragDist > 5) {
      isDragging = true;
    }

    const sensitivity = getControlVal("dragSensitivity", 1.2);

    camX += dx * sensitivity;
    camY += dy * sensitivity;

    velX = lerp(velX, dx * sensitivity * 0.8, 0.4);
    velY = lerp(velY, dy * sensitivity * 0.8, 0.4);

    lastPointerPos = { x: pos.x, y: pos.y };
  }
}

function onPointerUp(e) {
  if (isPointerDown) {
    isPointerDown = false;
    saveCanvasState();
  }
}

function onClick(e) {
  if (isDragging || dragDist > 5) {
    isDragging = false;
    dragDist = 0;
    return;
  }

  if (activeFlippedCard && activeFlippedCard.flipProgress > 0.3) {
    flipCardBack(activeFlippedCard);
  } else if (hoveredCard && !activeFlippedCard) {
    flipCardOpen(hoveredCard);
  }

  isDragging = false;
  dragDist = 0;
}

// Event Listeners Registration (Desktop Mouse + Mobile Touch)
canvas.addEventListener("wheel", onWheel, { passive: false });

canvas.addEventListener("mousedown", onPointerDown);
canvas.addEventListener("mousemove", onPointerMove);
canvas.addEventListener("mouseup", onPointerUp);
canvas.addEventListener("mouseleave", () => {
  if (isPointerDown) {
    isPointerDown = false;
    saveCanvasState();
  }
  mousePos = { x: -1000, y: -1000 };
});
canvas.addEventListener("click", onClick);

// Native Touch Listeners for Mobile & Touchscreens
canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    onPointerDown(e);
  }
}, { passive: true });

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1) {
    if (e.cancelable) e.preventDefault();
    onPointerMove(e);
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  onPointerUp(e);
  onClick(e);
}, { passive: true });

canvas.addEventListener("touchcancel", (e) => {
