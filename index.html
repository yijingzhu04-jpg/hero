// Prevent touch default scrolling behavior on canvas element

// Portable pointer resolution helper
function getPointerPos(e) {
  if (window.CanvasRuntimeAPI && typeof window.CanvasRuntimeAPI.getMousePos === "function") {
    try {
      return window.CanvasRuntimeAPI.getMousePos(e);
    } catch (err) {}
  }
  const rect = canvas.getBoundingClientRect();
  const touch = (e.touches && e.touches.length > 0)
    ? e.touches[0]
    : ((e.changedTouches && e.changedTouches.length > 0) ? e.changedTouches[0] : e);
  const clientX = touch ? touch.clientX : (e.clientX || 0);
  const clientY = touch ? touch.clientY : (e.clientY || 0);
  return {
    x: (clientX - rect.left) * (canvas.width / (rect.width || 1)),
    y: (clientY - rect.top) * (canvas.height / (rect.height || 1))
  };
}

// Helper: Linear interpolation
function lerp(a, b, t) {
  return a + (b - a) * t;
}

// Persistent Canvas State Wiring
function getControlVal(key, fallback) {
  if (window.controls && typeof window.controls.get === "function") {
    const val = window.controls.get(key);
    return val !== undefined ? val : fallback;
  }
  return fallback;
}

function applyCanvasState(state) {
  if (state && typeof state === "object") {
    camX = state.camX || 0;
    camY = state.camY || 0;
  }
}

if (window.controls && typeof window.controls.get === "function") {
  applyCanvasState(window.controls.get("canvasState"));
  window.controls.onChange("canvasState", (st) => applyCanvasState(st));
}

function saveCanvasState() {
  if (window.controls && typeof window.controls.set === "function") {
    window.controls.set("canvasState", { camX, camY });
  }
}

// Preload images into map
function preloadImages(urls) {
  urls.forEach((url) => {
    if (!imageCache.has(url)) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      img.onload = () => imageCache.set(url, img);
      imageCache.set(url, img);
    }
  });
}

// Rebuild card objects when schema or images change
function initCards() {
  const imageUrls = getControlVal("projectImages", DEFAULT_IMAGES);
  preloadImages(imageUrls);

  const entranceStagger = getControlVal("entranceStagger", 0.1);

  cards = imageUrls.map((url, i) => {
    const layout = LAYOUT_PRESETS[i % LAYOUT_PRESETS.length];
    const meta = PROJECT_METADATA[i % PROJECT_METADATA.length];

    const card = {
      id: i,
      url: url,
      title: meta.title,
      category: meta.category,
      tag: meta.tag,
      date: meta.date || "2026",
      relX: layout.relX,
      relY: layout.relY,
      baseW: layout.baseW,
      aspect: layout.aspect,
      naturalAspect: layout.aspect,
      floatPhase: layout.phase,
      entranceProgress: 0,
      hoverProgress: 0,
      floatOffset: 0,
      isHovered: false,
      projX: 0,
      projY: 0,
      width: 0,
      height: 0
    };

    // Staggered entrance animation using GSAP
    if (gsapLib) {
      gsapLib.to(card, {
        entranceProgress: 1,
        duration: 0.9,
        delay: i * entranceStagger,
        ease: "back.out(1.4)"
      });
    } else {
      card.entranceProgress = 1;
    }

    return card;
  });
}

// Draw rectangle helper (crisp square corners - 0px border radius)
function drawSquareRect(ctx, x, y, width, height) {
  ctx.beginPath();
  ctx.rect(x, y, width, height);
  ctx.closePath();
}

// Helper: Compute centered enlarged target dimensions respecting image intrinsic aspect ratio and viewport bounds
function getFocusedDimensions(card, w, h) {
  const cachedImg = imageCache.get(card.url);
  let aspect = card.naturalAspect || card.aspect || 1.0;
  if (cachedImg && cachedImg.complete && cachedImg.naturalHeight > 0) {
    aspect = cachedImg.naturalWidth / cachedImg.naturalHeight;
  }

  const marginFactor = w < 768 ? 0.85 : 0.82;
  const maxW = w * marginFactor;
  const maxH = h * marginFactor;

  let targetW = maxW;
  let targetH = targetW / aspect;

  if (targetH > maxH) {
    targetH = maxH;
    targetW = targetH * aspect;
  }

  return { targetW, targetH };
}

// Draw Card Helper
function drawCard(card, renderX, renderY, renderW, renderH, hoverProgress, alpha, isFocused = false) {
  if (alpha <= 0.001) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  const shadowAlpha = (0.08 + hoverProgress * 0.12 + (isFocused ? 0.15 : 0)) * alpha;
  const shadowOffsetY = (4 + hoverProgress * 8 + (isFocused ? 10 : 0));
  const shadowBlur = (12 + hoverProgress * 18 + (isFocused ? 24 : 0));

  ctx.shadowColor = `rgba(0, 0, 0, ${shadowAlpha})`;
  ctx.shadowOffsetY = shadowOffsetY;
  ctx.shadowBlur = shadowBlur;

  const halfW = renderW / 2;
  const halfH = renderH / 2;

  ctx.translate(renderX, renderY);

  // Background Fill
  ctx.fillStyle = "#FFFFFF";
  drawSquareRect(ctx, -halfW, -halfH, renderW, renderH);
  ctx.fill();

  ctx.shadowColor = "transparent";

  // Clipped Image Drawing
  ctx.save();
  drawSquareRect(ctx, -halfW, -halfH, renderW, renderH);
  ctx.clip();

  const cachedImg = imageCache.get(card.url);
  if (cachedImg && cachedImg.complete && cachedImg.naturalWidth > 0) {
    ctx.drawImage(cachedImg, -halfW, -halfH, renderW, renderH);
  } else {
    ctx.fillStyle = "#EAEAEA";
    ctx.fillRect(-halfW, -halfH, renderW, renderH);
  }
  ctx.restore();

  // Subtle Border Stroke
  ctx.strokeStyle = `rgba(0, 0, 0, ${0.06 + hoverProgress * 0.12})`;
  ctx.lineWidth = 1;
  drawSquareRect(ctx, -halfW, -halfH, renderW, renderH);
  ctx.stroke();

  ctx.restore();
}

// Trigger Focus Enlarge
function focusCard(card) {
  if (focusedCard || isFocusAnimating) return;

  focusedCard = card;
  isFocusAnimating = true;

  const hoverScaleSetting = getControlVal("hoverScale", 1.04);
  const currentHoverScale = 1 + card.hoverProgress * (hoverScaleSetting - 1);

  // Store exact starting screen position & dimensions (strictly maintaining current aspect ratio)
  focusStart = {
    projX: card.projX,
    projY: card.projY,
    width: card.width * currentHoverScale,
    height: card.height * currentHoverScale
  };

  const duration = getControlVal("flipDuration", 0.55);

  if (gsapLib) {
    gsapLib.to(focusState, {
      progress: 1,
      duration: duration,
      ease: "power3.out",
      onComplete: () => {
        isFocusAnimating = false;
      }
    });
  } else {
    focusState.progress = 1;
    isFocusAnimating = false;
  }
}

// Trigger Un-focus Shrink Back
function unfocusCard() {
  if (!focusedCard || isFocusAnimating) return;

  isFocusAnimating = true;
  const duration = getControlVal("flipDuration", 0.5);

  if (gsapLib) {
    gsapLib.to(focusState, {
      progress: 0,
      duration: duration,
      ease: "power3.inOut",
      onComplete: () => {
        focusedCard = null;
        isFocusAnimating = false;
      }
    });
  } else {
    focusState.progress = 0;
    focusedCard = null;
    isFocusAnimating = false;
  }
}

// Main Render Loop
function render() {
  const w = canvas.width;
  const h = canvas.height;

  timeSec += 0.016;

  const inertiaSetting = getControlVal("canvasInertia", 0.92);

  // Inertia momentum integration when not dragging and not focused
  if (!isPointerDown && !focusedCard && focusState.progress === 0) {
    camX += velX;
    camY += velY;

    velX *= inertiaSetting;
    velY *= inertiaSetting;

    if (Math.abs(velX) < 0.005) velX = 0;
    if (Math.abs(velY) < 0.005) velY = 0;
  }

  const floatAmplitude = getControlVal("floatAmplitude", 10);
  const floatDuration = getControlVal("floatDuration", 3.2);
  const hoverScaleSetting = getControlVal("hoverScale", 1.04);
  const cardScaleSetting = getControlVal("cardScale", 1.0);

  // Background Fill Color
  const bgColor = getControlVal("bgColor", "#ffffff");
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, w, h);

  // Watermark Image Background Rendering
  const wmUrl = getControlVal("watermarkImage", "");
  const wmScale = getControlVal("watermarkScale", 1.0);
  const wmOpacity = getControlVal("watermarkOpacity", 0.18);

  if (wmUrl && wmOpacity > 0.001) {
    preloadImages([wmUrl]);
    const wmImg = imageCache.get(wmUrl);
    if (wmImg && wmImg.complete && wmImg.naturalWidth > 0) {
      ctx.save();
      ctx.globalAlpha = wmOpacity;
      const baseWmDim = Math.min(w, h) * 0.45;
      const wmAspect = wmImg.naturalWidth / wmImg.naturalHeight;
      let wmW = baseWmDim * wmScale;
      let wmH = wmW / wmAspect;
      ctx.drawImage(wmImg, (w - wmW) / 2, (h - wmH) / 2, wmW, wmH);
      ctx.restore();
    }
  }

  const centerX = w / 2;
  const centerY = h / 2;

  const speed = (2 * Math.PI) / Math.max(0.5, floatDuration);
  const scaleFactor = Math.min(w / 1920, h / 1080) * cardScaleSetting;

  // Compute 2D Seamless Wrapping Grid Size
  const maxCardDim = 320 * scaleFactor;
  const gridW = Math.max(w + maxCardDim * 1.3, 1300);
  const gridH = Math.max(h + maxCardDim * 1.3, 950);

  // Position each card in infinite wrapped 2D space, strictly respecting intrinsic image aspect ratio
  cards.forEach((card) => {
    const cachedImg = imageCache.get(card.url);
    let aspect = card.aspect || 1.0;
    if (cachedImg && cachedImg.complete && cachedImg.naturalHeight > 0) {
      aspect = cachedImg.naturalWidth / cachedImg.naturalHeight;
    }
    card.naturalAspect = aspect;

    card.width = card.baseW * scaleFactor;
    card.height = card.width / aspect;

    // Base position in canonical grid pattern relative to center
    const baseAbsX = (card.relX - 0.5) * gridW;
    const baseAbsY = (card.relY - 0.5) * gridH;

    // Ambient floating sine wave
    if (!card.isHovered && !focusedCard) {
      card.floatOffset = Math.sin(timeSec * speed + card.floatPhase) * floatAmplitude;
    } else {
      card.floatOffset = lerp(card.floatOffset, 0, 0.1);
    }

    // Cumulative 2D position with camera offset
    const rawX = baseAbsX + camX;
    const rawY = baseAbsY + camY + card.floatOffset;

    // Infinite 2D Modulo Wrapping Math around canvas center
    let wrappedDx = (((rawX + gridW / 2) % gridW) + gridW) % gridW - gridW / 2;
    let wrappedDy = (((rawY + gridH / 2) % gridH) + gridH) % gridH - gridH / 2;

    card.projX = centerX + wrappedDx;
    card.projY = centerY + wrappedDy;
  });

  // Hit testing & hover state
  let currentHovered = null;
  if (!focusedCard && focusState.progress === 0) {
    for (let i = cards.length - 1; i >= 0; i--) {
      const card = cards[i];
      if (card.entranceProgress < 0.1) continue;

      const hoverScale = 1 + card.hoverProgress * (hoverScaleSetting - 1);
      const scaledW = card.width * hoverScale;
      const scaledH = card.height * hoverScale;

      if (
        mousePos.x >= card.projX - scaledW / 2 &&
        mousePos.x <= card.projX + scaledW / 2 &&
        mousePos.y >= card.projY - scaledH / 2 &&
        mousePos.y <= card.projY + scaledH / 2
      ) {
        currentHovered = card;
        break;
      }
    }
  }

  // Handle Hover Transitions
  cards.forEach((card) => {
    const isNowHovered = currentHovered === card;

    if (isNowHovered && !card.isHovered) {
      card.isHovered = true;
      if (gsapLib) {
        gsapLib.to(card, { hoverProgress: 1, duration: 0.25, ease: "power2.out" });
      } else {
        card.hoverProgress = 1;
      }
    } else if (!isNowHovered && card.isHovered) {
      card.isHovered = false;
      if (gsapLib) {
        gsapLib.to(card, { hoverProgress: 0, duration: 0.35, ease: "power2.out" });
      } else {
        card.hoverProgress = 0;
      }
    }
  });

  hoveredCard = currentHovered;

  const fp = focusState.progress;

  // STEP 1: Render all non-focused cards with fading opacity (1 -> 0)
  cards.forEach((card) => {
    if (card === focusedCard) return;
    if (1 - fp <= 0.001) return;

    const hoverScale = 1 + card.hoverProgress * (hoverScaleSetting - 1);
    const renderW = card.width * hoverScale * card.entranceProgress;
    const renderH = card.height * hoverScale * card.entranceProgress;
    const alpha = (1 - fp) * card.entranceProgress;

    drawCard(card, card.projX, card.projY, renderW, renderH, card.hoverProgress, alpha, false);
  });

  // STEP 2: Render Fixed Center Hero Typography ON TOP of floating cards layer
  const headingText = getControlVal("centerTextHeading", "Hi! I am Yijing Zhu.");
  const subText = getControlVal("centerTextSub", "Visual Designer and UX Researcher.");
  const textOpacity = getControlVal("textOpacity", 0.85) * (1 - fp);

  if ((headingText || subText) && textOpacity > 0.001) {
    const fontObj = getControlVal("mainFont", { family: "Inter", style: "normal", weight: 400 });
    const fontFam = (fontObj && fontObj.family) ? fontObj.family : "Inter";
    const fontWeight = (fontObj && fontObj.weight) ? fontObj.weight : 400;
    const fontStyle = (fontObj && fontObj.style) ? fontObj.style : "normal";
    const baseSize = getControlVal("textSize", 32);
    const textColor = getControlVal("textColor", "#111111");
    const textGlow = getControlVal("textGlow", 0.9);

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const gap = baseSize * 0.55;
    const subSize = Math.max(12, Math.round(baseSize * 0.56));
    const totalH = headingText && subText ? (baseSize + subSize + gap) : (headingText ? baseSize : subSize);
    let currentY = centerY - totalH / 2;

    function drawGlowText(text, x, y, fontStr, mainColor, mainAlpha) {
      const glowAlpha = textOpacity * textGlow;
      if (glowAlpha > 0.01) {
        ctx.save();
        ctx.font = fontStr;
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowColor = "rgba(255, 255, 255, 1.0)";
        
        // Pass 1: Broad soft ambient halo
        ctx.globalAlpha = glowAlpha * 0.85;
        ctx.shadowBlur = baseSize * 1.1;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillText(text, x, y);
        
        // Pass 2: Medium halo
        ctx.globalAlpha = glowAlpha * 0.95;
        ctx.shadowBlur = baseSize * 0.55;
        ctx.fillText(text, x, y);

        // Pass 3: Dense core halo
        ctx.globalAlpha = glowAlpha * 0.9;
        ctx.shadowBlur = baseSize * 0.22;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      // Crisp main text
      ctx.save();
      ctx.globalAlpha = mainAlpha;
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.font = fontStr;
      ctx.fillStyle = mainColor;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    if (headingText) {
      const fontStr1 = `${fontStyle} 500 ${baseSize}px "${fontFam}", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      drawGlowText(headingText, centerX, currentY + baseSize / 2, fontStr1, textColor, textOpacity);
      currentY += baseSize + gap;
    }

    if (subText) {
      const fontStr2 = `${fontStyle} 400 ${subSize}px "${fontFam}", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      drawGlowText(subText, centerX, currentY + subSize / 2, fontStr2, textColor, textOpacity * 0.75);
    }

    ctx.restore();
  }

  // STEP 2: Render Focused Card
  if (focusedCard && fp > 0) {
    const { targetW, targetH } = getFocusedDimensions(focusedCard, w, h);

    const curX = lerp(focusStart.projX, centerX, fp);
    const curY = lerp(focusStart.projY, centerY, fp);
    const curW = lerp(focusStart.width, targetW, fp);
    const curH = lerp(focusStart.height, targetH, fp);

    drawCard(focusedCard, curX, curY, curW, curH, 0, 1, true);
  }

  // Cursor state
  if (isDragging) {
    canvas.style.cursor = "grabbing";
  } else if (focusedCard) {
    canvas.style.cursor = "pointer";
  } else if (hoveredCard) {
    canvas.style.cursor = "pointer";
  } else {
    canvas.style.cursor = "grab";
  }
}

// Mouse Wheel 2D Scroll Impulse
function onWheel(e) {
  e.preventDefault();
  if (focusedCard || focusState.progress > 0) return;

  const sensitivity = getControlVal("dragSensitivity", 1.2);
  const deltaX = e.deltaX || 0;
  const deltaY = e.deltaY || 0;

  velX -= deltaX * 0.18 * sensitivity;
  velY -= deltaY * 0.18 * sensitivity;
}

// Pointer & Touch Drag Handlers
function onPointerDown(e) {
  const pos = getPointerPos(e);
  lastPointerPos = { x: pos.x, y: pos.y };
  mousePos = pos;
  dragDist = 0;
  isDragging = false;

  if (focusedCard || focusState.progress > 0) {
    isPointerDown = false;
    return;
  }

  isPointerDown = true;
}

function onPointerMove(e) {
  const pos = getPointerPos(e);
  mousePos = pos;

  if (isPointerDown && !focusedCard && focusState.progress === 0) {
    const dx = pos.x - lastPointerPos.x;
    const dy = pos.y - lastPointerPos.y;
    const dist = Math.hypot(dx, dy);
    dragDist += dist;

    if (dragDist > 5) {
      isDragging = true;
    }

    const sensitivity = getControlVal("dragSensitivity", 1.2);

    camX += dx * sensitivity;
    camY += dy * sensitivity;

    velX = lerp(velX, dx * sensitivity * 0.8, 0.4);
    velY = lerp(velY, dy * sensitivity * 0.8, 0.4);

    lastPointerPos = { x: pos.x, y: pos.y };
  }
}

function onPointerUp(e) {
  if (isPointerDown) {
    isPointerDown = false;
    saveCanvasState();
  }
}

function onClick(e) {
  if (isDragging || dragDist > 5) {
    isDragging = false;
    dragDist = 0;
    return;
  }

  if (focusedCard) {
    const w = canvas.width;
    const h = canvas.height;
    const fp = focusState.progress;
    const { targetW, targetH } = getFocusedDimensions(focusedCard, w, h);

    const curX = lerp(focusStart.projX, w / 2, fp);
    const curY = lerp(focusStart.projY, h / 2, fp);
    const curW = lerp(focusStart.width, targetW, fp);
    const curH = lerp(focusStart.height, targetH, fp);

    const clickPos = getPointerPos(e);
    const isInside = (
      clickPos.x >= curX - curW / 2 &&
      clickPos.x <= curX + curW / 2 &&
      clickPos.y >= curY - curH / 2 &&
      clickPos.y <= curY + curH / 2
    );

    if (!isInside) {
      unfocusCard();
    }
  } else if (hoveredCard) {
    focusCard(hoveredCard);
  }

  isDragging = false;
  dragDist = 0;
}

// Event Listeners Registration
canvas.addEventListener("wheel", onWheel, { passive: false });

canvas.addEventListener("mousedown", onPointerDown);
canvas.addEventListener("mousemove", onPointerMove);
canvas.addEventListener("mouseup", onPointerUp);
canvas.addEventListener("mouseleave", () => {
  if (isPointerDown) {
    isPointerDown = false;
    saveCanvasState();
  }
  mousePos = { x: -1000, y: -1000 };
});
canvas.addEventListener("click", onClick);

// Native Touch Listeners
canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    onPointerDown(e);
  }
}, { passive: true });

canvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1) {
    if (e.cancelable) e.preventDefault();
    onPointerMove(e);
  }
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  onPointerUp(e);
  onClick(e);
}, { passive: true });

canvas.addEventListener("touchcancel", (e) => {
  onPointerUp(e);
}, { passive: true });

// Render Loop
if (gsapLib) {
  gsapLib.ticker.add(render);
} else {
  function loop() {
    render();
    requestAnimationFrame(loop);
  }
  loop();
}

// Controls Listeners
if (window.controls && typeof window.controls.onChange === "function") {
  window.controls.onChange("projectImages", () => initCards());
  window.controls.onChange("entranceStagger", () => initCards());
  window.controls.onChange("watermarkImage", (url) => {
    if (url) preloadImages([url]);
  });
}

// Initialize
initCards();

    }

    
  </script>
  <script>
    (function() {
      if (!document.fonts || !document.fonts.load) return;
      var _fams = ["Inter"];
      var _replay = function() {
        var _api = window.ControlsAPI;
        if (!_api || !_api.getAll || !_api.set) return;
        var _all = _api.getAll();
        Object.keys(_all).forEach(function(k) { _api.set(k, _all[k]); });
      };
      Promise.all(_fams.map(function(f) {
        return document.fonts.load('1em "' + f + '"').catch(function() {});
      })).then(_replay);
      // The sheet can still be in flight when the promises settle empty; a late sweep costs
      // one extra repaint and covers a slow CDN.
      setTimeout(_replay, 2500);
    })();
  </script>
